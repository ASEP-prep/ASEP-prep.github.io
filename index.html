<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<!-- Ασφάλεια: εκτελείται μόνο κώδικας από τα αρχεία της εφαρμογής (όχι inline scripts ή κώδικας μέσα σε δεδομένα).
     Τα στυλ επιτρέπονται inline επειδή η εφαρμογή χρησιμοποιεί style="…" για μπάρες προόδου. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>ASEP-prep – ανεπίσημη εξάσκηση για τον διαγωνισμό ΑΣΕΠ</title>
<meta name="description" content="Ανεπίσημη εφαρμογή εξάσκησης για τον Πανελλήνιο Γραπτό Διαγωνισμό ΑΣΕΠ. Δεν σχετίζεται με το ΑΣΕΠ.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18202D" media="(prefers-color-scheme: dark)">

<main id="view" tabindex="-1">
  <p class="loading">Φόρτωση…</p>
</main>

<footer class="appfoot">
  <p><strong>Ανεπίσημη εφαρμογή.</strong> Δεν σχετίζεται με το ΑΣΕΠ ή άλλον δημόσιο φορέα. Για τους κανόνες του διαγωνισμού ισχύει μόνο η προκήρυξη.</p>
  <p class="versions"><span id="ver-app"></span> <span id="ver-bank"></span> <a href="#about">Σχετικά</a></p>
</footer>
